# What the MCP conformance suite expects from a server that this one will never be.
# `bun run protocol:check` fails on any other failure, and on an entry here that
# starts passing, so this list can't go stale.
server:
  # These call a tool, prompt, or resource the suite's own test server defines, such
  # as `test_simple_text` or `test://static-text`. Ours are coach workspace tools.
  - completion-complete
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - prompts-get-embedded-resource
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-with-image
  - resources-read-binary
  - resources-read-text
  - resources-templates-read
  - tools-call-audio
  - tools-call-elicitation
  - tools-call-embedded-resource
  - tools-call-error
  - tools-call-image
  - tools-call-mixed-content
  - tools-call-sampling
  - tools-call-simple-text
  - tools-call-with-progress
  # Optional features this server doesn't declare: logging and resource subscriptions.
  - logging-set-level
  - resources-subscribe
  - resources-unsubscribe
  - tools-call-with-logging
  # Needs sessions. This server is stateless, so a Worker isolate can recycle freely.
  - server-sse-multiple-streams
