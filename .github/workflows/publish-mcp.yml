name: Publish MCP

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.5.1
      - run: bun install --frozen-lockfile
      - name: Verify tag and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "mcp-v${VERSION}"
          test "$(node -p "require('./package.json').private === true")" = "false"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
      - run: bun run verify
        env:
          CI: true
      - run: bun run deploy:dry-run
      - name: Publish package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "@setluca/mcp@${VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED" != "$VERSION" ]; then
            npm publish --provenance=false
          fi

  deploy-remote:
    name: Deploy remote Worker
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public Worker
        run: bun scripts/check-deployed-worker.ts "$(bun -p "require('./package.json').version")"

  publish-registry:
    name: Publish to MCP registry
    needs: [publish, deploy-remote]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        env:
          PUBLISHER_VERSION: v1.8.0
          PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
      - run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Registry publish attempt ${attempt} failed; retrying in 30 seconds."
            sleep 30
          done
          exit 1

  github-release:
    name: Create GitHub release
    needs: [publish, deploy-remote, publish-registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          PREVIOUS="$(git tag -l 'mcp-v*' --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -1 || true)"
          RANGE="${PREVIOUS:+${PREVIOUS}..}${RELEASE_TAG}"
          git log --no-merges --pretty='- %s' "$RANGE" > notes.md
          gh release create "$RELEASE_TAG" \
            --title "Luca MCP v${RELEASE_TAG#mcp-v}" \
            --notes-file notes.md \
            --verify-tag
